<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinanceTerminal</title>
    <style>
      :root {
        --cyan: #00d4ff;
        --amber: #f59e0b;
        --green: #00ff88;
        --red: #ff3366;
        --bg: #030608;
        --paper: #080f1c;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: var(--bg); }
      ::-webkit-scrollbar { width: 6px; height: 6px; }

      ::-webkit-scrollbar-thumb { background: rgba(0, 212, 255, 0.3); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(0, 212, 255, 0.5); }
      ::selection { background: rgba(0, 212, 255, 0.25); color: #fff; }

    <div id="root"></div>
